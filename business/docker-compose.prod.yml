version: "3.8"

services:
  frontend:
    build:
      context: ./svi-preview
      dockerfile: Dockerfile.prod
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=${BACKEND_URL:-http://localhost:3001}
    depends_on:
      - backend
    networks:
      - svi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
    networks:
      - svi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  svi-network:
    driver: bridge
