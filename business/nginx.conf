server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # API proxy to Coolify backend container
    # Using variable so nginx doesn't fail at startup if backend is down
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend_upstream http://ai-defense-apps-business-backend:3001;

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # SPA routes
    location /assess {
        try_files $uri /assess.html;
    }

    location /results {
        try_files $uri /results.html;
    }

    location /portal/ {
        try_files $uri /portal.html;
    }

    # Static assets
    location /css/ {
        try_files $uri =404;
    }

    location /js/ {
        try_files $uri =404;
    }

    # Health check via nginx
    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Default
    location / {
        try_files $uri $uri/ /index.html;
    }
}
